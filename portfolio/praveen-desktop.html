  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

dding:14px clamp(12px,2vw,20px);border-left:1px solid rgba(255,255,255,.1)\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#7d9a9b;margin-bottom:12px\">INVESTED PORTFOLIO<\u002Fdiv><div style=\"font-size:clamp(28px,4vw,38px);font-weight:800;color:#60dbd0;letter-spacing:-.03em;line-height:1\">~$360k<\u002Fdiv><div style=\"font-size:12.5px;color:#9fbfc0;margin-top:8px\">Calls acted on and deployed<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:14px clamp(12px,2vw,20px);border-left:1px solid rgba(255,255,255,.1)\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#7d9a9b;margin-bottom:12px\">MONITORED PORTFOLIO<\u002Fdiv><div style=\"font-size:clamp(28px,4vw,38px);font-weight:800;color:#60dbd0;letter-spacing:-.03em;line-height:1\">~$450k<\u002Fdiv><div style=\"font-size:12.5px;color:#9fbfc0;margin-top:8px\">Post-deployment oversight<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:14px clamp(12px,2vw,20px);border-left:1px solid rgba(255,255,255,.1)\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#7d9a9b;margin-bottom:12px\">FAVOURABLE DECISIONS<\u002Fdiv><div style=\"font-size:clamp(28px,4vw,38px);font-weight:800;color:#60dbd0;letter-spacing:-.03em;line-height:1\">~29%<\u002Fdiv><div style=\"font-size:12.5px;color:#9fbfc0;margin-top:8px\">7 of 24 tracked<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:14px clamp(12px,2vw,20px);border-left:1px solid rgba(255,255,255,.1)\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#7d9a9b;margin-bottom:12px\">ADVERSE JUDGEMENTS<\u002Fdiv><div style=\"font-size:clamp(28px,4vw,38px);font-weight:800;color:#60dbd0;letter-spacing:-.03em;line-height:1\">~38%<\u002Fdiv><div style=\"font-size:12.5px;color:#9fbfc0;margin-top:8px\">9 of 24 tracked<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:14px clamp(12px,2vw,20px);border-left:1px solid rgba(255,255,255,.1)\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#7d9a9b;margin-bottom:12px\">INCONCLUSIVE<\u002Fdiv><div style=\"font-size:clamp(28px,4vw,38px);font-weight:800;color:#60dbd0;letter-spacing:-.03em;line-height:1\">~33%<\u002Fdiv><div style=\"font-size:12.5px;color:#9fbfc0;margin-top:8px\">8 of 24 tracked<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:12.5px;line-height:1.6;color:#7a8a83;margin:14px 0 0\">* Percentages cover invested and passed opportunities. Portco monitoring excluded from call accuracy. Approximate figures to the best of my knowledge and availability of public data.<\u002Fp>\n\n      <p style=\"font-size:clamp(15px,2vw,17px);line-height:1.7;color:#3f5650;margin:26px 0 0;text-wrap:pretty\">Deals were sourced through structured networks of private angel and early-stage investment platforms, as well as proprietary connections. A typical month involved reviewing 6 to 10 pitches, attending follow-up founder meetings, and working through data rooms before shortlisting one or two for full evaluation. Over 30 opportunities were reviewed across the tenure; 24 are documented here with tracked outcomes.<\u002Fp>\n\n      <!-- legend -->\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:24px\">\n        <div style=\"display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #d8e4df;border-radius:99px;padding:9px 16px\"><span style=\"width:8px;height:8px;border-radius:99px;background:#2f9e74;flex:none\"><\u002Fspan><span style=\"font-size:13.5px;font-weight:600;color:#042433\">Good Call<\u002Fspan><span style=\"font-size:13px;color:#7a8a83\">thesis right, call acted on, outcome positive<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #d8e4df;border-radius:99px;padding:9px 16px\"><span style=\"width:8px;height:8px;border-radius:99px;background:#d98a3d;flex:none on follow-on decisions and supporting exits.<\u002Fp>\n\n      <div class=\"dealgrid\" data-hover=\"{{ hoverVal }}\" style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px\">\n        <sc-for list=\"{{ portcos }}\" as=\"card\" hint-placeholder-count=\"7\">\n          <div class=\"dealcard\" onclick=\"{{ card.onToggle }}\" style=\"position:relative;overflow:hidden;background:#fff;border:1px solid #d8e4df;border-radius:14px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:13px;min-height:196px\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:10px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;color:#5e8d76;line-height:1.5\">{{ card.tags }}<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:6px;flex:none\">\n                <span style=\"{{ card.badgeStyle }}\"><span style=\"{{ card.dotStyle }}\"><\u002Fspan>{{ card.verdict }}<\u002Fspan>\n                <sc-if value=\"{{ card.sub }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:#fff;background:#3b82c4;border-radius:99px;padding:4px 8px\">{{ card.sub }}<\u002Fspan><\u002Fsc-if>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:15.5px;line-height:1.45;font-weight:600;color:#1c2c28;margin:0;letter-spacing:-.005em;text-wrap:pretty\">{{ card.desc }}<\u002Fp>\n            <div style=\"margin-top:auto;display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:#9aa8a3\"><span style=\"width:14px;height:1px;background:#cbd8d2\"><\u002Fspan>READ THE NOTE +<\u002Fdiv>\n            <div class=\"deal-overlay\" style=\"{{ card.overlayStyle }}\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n                <span style=\"display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:#7fb6e6\"><span style=\"{{ card.dotStyle }}\"><\u002Fspan>{{ card.verdict }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:#7d9a9b\">CLOSE ×<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"font-size:13.5px;line-height:1.6;color:#d3e3dd;margin:0;text-wrap:pretty\">{{ card.learning }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- CONTACT -->\n  <div id=\"contact\" style=\"background:#042433;padding:clamp(40px,6vw,60px) clamp(20px,5vw,44px)\">\n    <div style=\"max-width:1120px;margin:0 auto;text-align:center\">\n      <h2 style=\"font-size:clamp(30px,5vw,44px);font-weight:800;color:#fff;margin:0 0 14px;letter-spacing:-.03em\">Let's connect<\u002Fh2>\n      <p style=\"font-size:clamp(15px,2vw,17px);color:#a7c0c2;margin:0 0 30px\">Deal sourcing | Investment Research | Target Evaluation | Portfolio Monitoring<\u002Fp>\n      <div style=\"display:flex;gap:12px;justify-content:center;flex-wrap:wrap\">\n        <a href=\"mailto:pivotwithpk@gmail.com\" onclick=\"{{ copyEmail }}\" style=\"display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(96,219,208,.35);color:#cfe6df;font-size:15px;font-weight:600;padding:13px 26px;border-radius:99px;text-decoration:none;cursor:pointer\">{{ emailLabel }}<\u002Fa>\n        <a href=\"https://www.linkedin.com/in/praveen-kompella-84ab0b90/\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(96,219,208,.35);color:#cfe6df;font-size:15px;font-weight:600;padding:13px 26px;border-radius:99px;text-decoration:none\">LinkedIn<\u002Fa>\n        <a href=\"https://x.com/praveenkompella\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(96,219,208,.35);color:#cfe6df;font-size:15px;font-weight:600;padding:13px 26px;border-radius:99px;text-decoration:none\">X<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FOOTER -->\n  <div style=\"background:#fff;padding:26px clamp(20px,5vw,44px);border-top:1px solid #e7ebe9\">\n    <div style=\"max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px\">\n      <div style=\"display:flex;align-items:center;gap:20px\">\n        <img src=\"eda5c51f-65d4-4629-862e-80aeb55208da\" alt=\"Vestorium\" style=\"height:22px;width:auto;display:block\">\n        <span style=\"font-size:13px;color:#7a8580\">© 2026 · Praveen Kompella<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;expandAll&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;hoverReveal&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nclass Component extends DCLogic {\n  state = { open: null, emailCopied: false };\n\n  toggle(key){ this.setState(s => ({ open: s.open === key ? null : key })); }\n\n  copyEmail(e){\n    if (e && e.preventDefault) e.preventDefault();\n    const addr = 'pivotwithpk@gmail.com';\n    const legacyCopy = () => {\n      try {\n        const ta = document.createElement('textarea');\n        ta.value = addr;\n        ta.setAttribute('readonly','');\n        ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';\n        document.body.appendChild(ta);\n        ta.focus(); ta.select();\n        ta.setSelectionRange(0, addr.length);\n        document.execCommand('copy');\n        document.body.removeChild(ta);\n      } catch(_){}\n    };\n    try {\n      if (navigator.clipboard && navigator.clipboard.writeText) {\n        navigator.clipboard.writeText(addr).catch(legacyCopy);\n      } else {\n        legacyCopy();\n      }\n    } catch(_){ legacyCopy(); }\n    this.setState({ emailCopied: true });\n    clearTimeout(this._emailT);\n    this._emailT = setTimeout(() => this.setState({ emailCopied: false }), 1800);\n  }\n\n  badge(v){\n    const m = {\n      'Good Call':          { c:'#15795f', bg:'rgba(77,179,163,.13)',  dot:'#2f9e74' },\n      'Missed Opportunity': { c:'#b06a1f', bg:'rgba(214,138,61,.14)',  dot:'#d98a3d' },\n      'Poor Call':          { c:'#b0473d', bg:'rgba(192,88,78,.13)',   dot:'#c0584e' },\n      'Inconclusive':       { c:'#5a6862', bg:'rgba(86,101,95,.12)',   dot:'#8a988f' },\n      'Portco':             { c:'#2b6cb0', bg:'rgba(43,108,176,.12)',  dot:'#3b82c4' }\n    };\n    return m[v] || m['Inconclusive'];\n  }\n\n  deals = [\n    { tags:'Fintech, Payments, Rural', desc:'Digital payments platform for Bharat merchants', call:'No', acted:'Yes', verdict:'Poor Call', learning:'Said no on competitive saturation grounds. Call was acted on. Investors who backed it secured exits later. Underweighted the resilience of a focused vertical player in rural payments.' },\n    { tags:'D2C, Healthy Snacking', desc:'Health-first snack brand with strong distribution', call:'Yes', acted:'Yes', verdict:'Inconclusive', learning:'Backed on valuation and distribution strength. Company has grown steadily with a Series A extension but no strong markup event yet. Verdict still open.' },\n    { tags:'Fintech, Debt Relief', desc:'Lending platform addressing personal debt restructuring', call:'Yes', acted:'No', verdict:'Good Call', learning:'Recommended a non-consensus play in structured debt relief. Call was not acted on. Company has since raised significant institutional capital and scaled to 300+ employees. The thesis held.' },\n    { tags:'IoT, FASTag, Supply Chain', desc:'Vehicle tracking and FASTag payments infrastructure', call:'No', acted:'No', verdict:'Inconclusive', learning:'Flagged inconsistencies in the data room: fundraise amount vs. stated needs. Investment went ahead regardless. Company has since scaled to 4M+ vehicles, but traction was not visible at the time of evaluation.' },\n    { tags:'EdTech, AR/VR, Industrial', desc:'AR-based skilling platform for blue-collar workers', call:'Yes', acted:'Yes', verdict:'Good Call', learning:'Backed on an enterprise skilling thesis. Company raised a Series A, trained 1.8 lakh+ workers, and made its first AI acquisition. One of the cleanest thesis-to-outcome alignments in the portfolio.' },\n    { tags:'HealthTech, MedTech, AI', desc:'AI-powered blood diagnostics with fast turnaround', call:'Yes', acted:'Yes', verdict:'Inconclusive', learning:\"Backed on strong early traction and sector specialists' endorsement. No evidence of follow-on institutional round in public data. Revenue is growing but too early to call.\" },\n    { tags:'Safety Hardware, IoT', desc:'Smart helmets for industrial safety with modular design', call:'Yes', acted:'No', verdict:'Good Call', learning:'Recommended on product defensibility and a clear safety use case. Call not acted on. Company subsequently achieved a roughly 5x valuation uplift. Thesis was right.' },\n    { tags:'CleanTech, Solar, AI SaaS', desc:'AI-based solar asset analytics and management', call:'No', acted:'Yes', verdict:'Good Call', learning:'Passed on concentrated related-party revenue, a structural credibility concern. Call acted on. Company was later acquired by a global tech major. Still believe the process was right; the data at the time warranted the pass.' },\n    { tags:'QSR, Food and Beverage', desc:'Indian burger chain with a proven format', call:'No', acted:'Yes', verdict:'Missed Opportunity', learning:'Passed because the ticket size felt disproportionate to F&B risk. Call acted on. Company raised a Series B at a strong uplift. Conflated ticket-size discomfort with business quality, a lesson carried forward.' },\n    { tags:'AR, Restaurant Tech', desc:'AR-based menu and restaurant discovery platform', call:'Yes', acted:'No', verdict:'Inconclusive', learning:'Saw potential in low-friction restaurant adoption. Call not acted on. Reasonable concerns about replication risk and low ARPU. No public outcome data. Genuinely inconclusive.' },\n    { tags:'Logistics, Drones, DeepTech', desc:'Autonomous drone delivery for last-mile logistics', call:'Yes', acted:'Yes', verdict:'Good Call', learning:'Backed on strong contract traction, government partnerships, and a compressing last-mile delivery thesis. Company raised a $9mn Series B. High return on initial position.' },\n    { tags:'OTT, Regional Content, Media', desc:'Regional-language streaming platform', call:'No', acted:'Yes', verdict:'Good Call', learning:'Passed at the requested ticket size. Valuation felt high given OTT competition. Company grew to significant revenue and raised a Series B. The pass at that entry and size was still correct. Price discipline matters as much as thesis quality.' },\n    { tags:'Drones, AgriTech, Defence', desc:'Drone manufacturer with agritech and defence focus', call:'No', acted:'Yes', verdict:'Missed Opportunity', learning:'Passed on valuation and forced-exit risk. Company raised a large Series B, commands ~50% agritech drone market share, and is targeting an IPO. Missed: market structure dominance can override entry-point concerns.' },\n    { tags:'D2C, Healthy Food, FMCG', desc:'Health-focused noodles and pasta brand', call:'Yes', acted:'Yes', verdict:'Good Call', learning:'Backed on strong branding, founder pedigree, and clean product positioning. Company raised multiple rounds, expanded to 5,000+ retail outlets, and achieved strong year-on-year revenue growth.' },\n    { tags:'Rural Commerce, FMCG', desc:'Building rural brands and distribution, village-level commerce platform', call:'No', acted:'No', verdict:'Inconclusive', learning:'Was uncertain and did not recommend. Investment went ahead regardless. No public outcome data. Reinforced that rural India requires a different analytical lens than urban frameworks.' },\n    { tags:'HRTech, AI, SaaS', desc:'AI-powered recruitment and candidate-matching SaaS', call:'No', acted:'Yes', verdict:'Missed Opportunity', learning:'Passed on entry valuation, wanting more technical DD. Company raised a significant Series A with 120+ enterprise clients. Waiting for perfect diligence at seed stage is too conservative. The window does not stay open.' },\n    { tags:'F&B, Dairy, Consumer', desc:'Omnichannel dairy brand with premium positioning', call:'No', acted:'Yes', verdict:'Missed Opportunity', learning:'Passed on F&B competitiveness. Company raised significantly at a strong valuation. Applied a generic sector filter instead of evaluating specific brand defensibility, a recurring miss pattern in consumer.' },\n    { tags:'F&B, Coffee, D2C', desc:'Artisanal premium coffee brand', call:'No', acted:'Yes', verdict:'Missed Opportunity', learning:'Passed on the same competitive logic. Brand secured a prominent angel and continued growing. Brand energy and founder conviction can carry a niche further than analysis alone suggests. Minor miss; lesson reinforced.' },\n    { tags:'F&B, Consumer, D2C', desc:'Popsicle brand that rode a major media wave', call:'No', acted:'Yes', verdict:'Inconclusive', learning:'Passed on F&B grounds. Brand expanded rapidly on media exposure but revenue corrected sharply after. The underlying metrics were fragile. Not a call I regret.' },\n    { tags:'Rural Fintech, Bharat', desc:'Village-level entrepreneur and fintech network', call:'Yes', acted:'No', verdict:'Inconclusive', learning:'Recommended on market size and genuine underserved traction. Call not acted on. Platform grew to 35K+ village entrepreneurs serving 800K+ families. Investors likely secured exits but no confirmed public data.' },\n    { tags:'DOOH, Media, AdTech', desc:'Digital screens across elevators and high-traffic spaces', call:'No', acted:'Yes', verdict:'Missed Opportunity', learning:'Passed because I could not adequately assess business model defensibility. Company raised significantly across rounds; investors appear to have exited at an upround. Not understanding a model is a reason for more work, not a pass.' },\n    { tags:'Consumer Services, Automotive', desc:'Doorstep two-wheeler maintenance and servicing', call:'Yes', acted:'No', verdict:'Poor Call', learning:'Recommended on a doorstep services thesis. Call not acted on. Company showed early momentum post-fundraise but has since lost all visible traction. Broader category grew. Outcome here was likely execution-specific.' },\n    { tags:'D2C, EyeWear, Consumer', desc:'Direct-to-consumer eyewear brand with omnichannel play', call:'Yes', acted:'Yes', verdict:'Poor Call', learning:\"Backed on brand strength and distribution credentials. Company raised significantly and showed real growth for a period. Later faced insolvency proceedings. The founder's prior startup history deserved more structured scrutiny, not just a narrative accept.\" },\n    { tags:'D2C, Beverages, Consumer', desc:'Craft beverage brand targeting the premium segment', call:'No', acted:'No', verdict:'Inconclusive', learning:'Passed. Investment went ahead regardless. Brand is operational with a new product line but no institutional follow-on. One co-founder has since moved on. Genuinely inconclusive.' }\n  ];\n\n  portcos = [\n    { tags:'AI, Ecommerce, Personalisation', desc:'AI-driven personalisation for ecommerce platforms', verdict:'Portco', sub:'', learning:'Monitored post-deployment. An exit offer arose and was not taken in anticipation of a higher return later. No public data on subsequent outcomes. Key takeaway: product-market fit signals can look compelling before the business model is proven at scale.' },\n    { tags:'Agri, Grocery, D2C', desc:'Farm-to-fork grocery delivery platform', verdict:'Portco', sub:'Exited', learning:'Exit secured in 2023, timely as the company shut down in May 2025 with 300 employees affected. Reading when a capital-intensive model is approaching structural limits mattered more than waiting for the next headline round.' },\n    { tags:'HealthTech, Emergency Medical', desc:'Emergency ambulance and ICU coordination platform', verdict:'Portco', sub:'Exited', learning:'Exit secured during monitoring tenure. Terms not publicly available. Outcome was positive from a portfolio perspective.' },\n    { tags:'AI, Enterprise, SaaS', desc:'B2B conversational AI for enterprise process automation', verdict:'Portco', sub:'', learning:'Advised against follow-on when fundraise narrative shifted from growth-driven to survival-mode. No additional capital deployed. No meaningful valuation step-up since. Knowing when to hold back capital is as important as knowing when to deploy.' },\n    { tags:'B2C, Cybersecurity, Privacy', desc:'B2C cybersecurity and malware protection device and software', verdict:'Portco', sub:'', learning:'Follow-on raise attempted during a challenging operational phase. Advised against participation. Company has stabilised at a maintenance level. Not every portfolio company will grow; protecting existing capital is a discipline.' },\n    { tags:'HRTech, Talent, Hackathons', desc:'Enterprise talent sourcing via hackathon-based hiring', verdict:'Portco', sub:'Acquired', learning:'Acquired by a larger EdTech firm in a share-swap. Exchange ratio not confirmed publicly; founder subsequently departed. Acqui-hire adjacent outcomes are common at this stage and require active expectation management.' },\n    { tags:'Fintech, Payments, BNPL', desc:'Digital payments and BNPL platform (now listed)', verdict:'Portco', sub:'IPO', learning:'Managed unlisted-to-IPO transition. Original entry in unlisted market at a significant per-share price. Listed Dec 2024 at a premium; stock has since corrected substantially. IPO timing and unlisted pricing discipline are distinct skills from evaluating the underlying business.' }\n  ];\n\n  renderVals(){\n    const open = this.state.open;\n    const expandAll = !!this.props.expandAll;\n    const hoverReveal = this.props.hoverReveal ?? true;\n    const mono = \"'JetBrains Mono',monospace\";\n    const mk = (arr, prefix) => arr.map((d, i) => {\n      const key = d._k || (prefix + i);\n      const b = this.badge(d.verdict);\n      return {\n        ...d,\n        key,\n        isOpen: (expandAll || open === key),\n        onToggle: () => this.toggle(key),\n        verdictColor: b.c,\n        badgeStyle: { display:'inline-flex', alignItems:'center', gap:'7px', flex:'none', fontFamily:mono, fontSize:'10.5px', letterSpacing:'.08em', textTransform:'uppercase', color:b.c, background:b.bg, borderRadius:'99px', padding:'5px 11px', whiteSpace:'nowrap' },\n        dotStyle: { width:'6px', height:'6px', borderRadius:'99px', background:b.dot, flex:'none' },\n        overlayStyle: { position:'absolute', inset:0, background:'#042433', padding:'20px', display:'flex', flexDirection:'column', gap:'12px', overflow:'auto', opacity:(expandAll || open === key) ? 1 : 0, pointerEvents:(expandAll || open === key) ? 'auto' : 'none' }\n      };\n    });\n    const order = { 'Good Call':0, 'Poor Call':1, 'Inconclusive':2, 'Missed Opportunity':3 };\n    const sortedDeals = this.deals.map((d,i)=>({ ...d, _k:'d'+i })).sort((a,b)=> order[a.verdict]-order[b.verdict]);\n    return {\n      deals: mk(sortedDeals, 'd'),\n      portcos: mk(this.portcos, 'p'),\n      hoverVal: hoverReveal ? '1' : '0',\n      emailLabel: this.state.emailCopied ? 'Copied ✓' : 'Email',\n      copyEmail: (e) => this.copyEmail(e)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
